<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday Aayushi 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;600&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#F3B8C6;--lav:#C9B9E8;--cream:#FFF5E9;--sage:#A8B99A;--gold:#D8B779;--plum:#34243A;--rose:#D78D9F}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--plum);color:var(--cream);font:16px/1.55 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;line-height:1.15}
h1{font-size:clamp(2rem,8vw,3.4rem)}h2{font-size:clamp(1.6rem,6vw,2.4rem);margin-bottom:.4em}
.script{font-family:'Dancing Script',cursive;font-size:clamp(1.3rem,5vw,1.9rem);color:var(--pink)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#bg{position:fixed;inset:0;transition:background 1.4s}
#fx{position:fixed;inset:0;pointer-events:none;z-index:55}
.scene{position:fixed;inset:0;display:none;overflow:auto;padding:30px 14px 100px;flex-direction:column}
.scene.on{display:flex;animation:in 1s both}.scene.out{display:flex;animation:out .45s both;pointer-events:none}
@keyframes in{from{opacity:0;transform:scale(1.07);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes out{to{opacity:0;transform:scale(.95)}}
.box{margin:auto;width:100%;max-width:720px;text-align:center}
.glass{background:rgba(255,245,233,.13);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(216,183,121,.55);border-radius:24px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.35),0 0 30px rgba(216,183,121,.15)}
.btn{display:inline-block;margin:10px 4px 0;padding:12px 26px;border-radius:99px;background:linear-gradient(135deg,var(--gold),#f0d9a5);color:var(--plum);font-weight:600;box-shadow:0 0 22px rgba(216,183,121,.5);transition:transform .2s}
.btn:hover{transform:translateY(-2px) scale(1.03)}
.btn2{display:block;width:100%;margin:8px 0;padding:12px;border-radius:14px;background:rgba(255,245,233,.15);border:1px solid var(--gold);transition:.2s}
.btn2:hover{background:rgba(216,183,121,.3)}.btn2.ok{background:#a8b99a;color:var(--plum)}.btn2.no{background:var(--rose)}
input{padding:12px 18px;margin:12px 0 4px;border-radius:99px;border:1px solid var(--gold);background:rgba(255,245,233,.9);color:var(--plum);font-size:1.1rem;text-align:center;letter-spacing:.2em;width:min(260px,100%)}
#flash{position:fixed;inset:0;z-index:65;background:radial-gradient(circle,#fff6d8,rgba(216,183,121,.6) 50%,transparent 75%);opacity:0;pointer-events:none}#flash.go{animation:fl 2s}@keyframes fl{30%{opacity:1}to{opacity:0}}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:70;padding:10px 14px max(14px,env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;background:linear-gradient(transparent,rgba(52,36,58,.9))}
#nav button{width:44px;height:44px;border-radius:50%;background:rgba(255,245,233,.15);border:1px solid var(--gold);font-size:1.2rem;flex:none}
#nav button:disabled{opacity:.3;cursor:default}
#pg{flex:1;text-align:center;font-size:.8rem}#bar{height:5px;border-radius:5px;background:rgba(255,245,233,.2);margin-top:4px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--gold));transition:width .8s}
#modal{position:fixed;inset:0;z-index:80;background:rgba(30,18,36,.7);display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
#modal.show{display:flex}.mcard{max-width:480px;width:100%;max-height:92vh;overflow:auto;text-align:center;position:relative;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.7) rotate(-4deg)}}
.x{position:absolute;top:8px;right:12px;font-size:1.3rem;z-index:2}.mcard p{margin-top:8px}
.sb{position:fixed;z-index:20;font-size:24px;opacity:.3;animation:tw 3s infinite}@keyframes tw{50%{opacity:.7;transform:scale(1.2) rotate(8deg)}}
#toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-30px);z-index:90;padding:10px 20px;border-radius:99px;background:var(--gold);color:var(--plum);opacity:0;transition:.5s;pointer-events:none;font-weight:600;max-width:92vw;text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}
.bf{position:fixed;z-index:60;left:-8%;pointer-events:none;animation:fly linear forwards}
@keyframes fly{25%{transform:translateY(-9vh) rotate(8deg)}50%{transform:translateY(7vh) rotate(-8deg)}75%{transform:translateY(-6vh) rotate(6deg)}to{left:108%}}
/* gate */
.door{position:fixed;top:0;bottom:0;width:50%;z-index:1;transition:transform 2.2s cubic-bezier(.6,0,.2,1);background:repeating-linear-gradient(90deg,#5a3f5e 0 14px,#4a3350 14px 28px);border:2px solid var(--gold)}
.door.l{left:0}.door.r{right:0}.open .door.l{transform:translateX(-102%)}.open .door.r{transform:translateX(102%)}.open .glass{opacity:0;transition:1s}
.gate .glass{position:relative;z-index:2}.shake{animation:sh .5s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
/* window */
.win{position:relative;width:min(260px,70vw);height:340px;margin:30px auto;border:8px solid var(--gold);border-radius:130px 130px 8px 8px;overflow:hidden;background:linear-gradient(#ffd9e3,#c9b9e8 60%,#a8b99a);cursor:pointer;box-shadow:0 0 50px rgba(243,184,198,.5)}
.win .view{position:absolute;inset:0;display:grid;place-items:center;font-size:4rem}.win .view img{width:100%;height:100%;object-fit:cover;display:block}
.curt{position:absolute;top:0;bottom:0;width:52%;background:repeating-linear-gradient(90deg,#d78d9f 0 10px,#c47a8d 10px 20px);transition:transform 2s}.curt.l{left:0;transform-origin:left}.curt.r{right:0;transform-origin:right}
.win.open .curt{transform:scaleX(.15)}
.hid{opacity:0;transform:translateY(20px);transition:1.2s}.vis{opacity:1;transform:none}
/* cake */
.cake{position:relative;width:240px;height:260px;margin:40px auto 10px}
.lay{position:absolute;left:50%;transform:translateX(-50%);border-radius:14px}.l1{bottom:0;width:240px;height:70px;background:linear-gradient(var(--pink),var(--rose))}.l2{bottom:70px;width:180px;height:60px;background:linear-gradient(var(--cream),var(--lav))}.l3{bottom:130px;width:120px;height:50px;background:linear-gradient(var(--pink),var(--rose))}
.l1::after,.l3::after{content:'';position:absolute;top:0;left:0;right:0;height:14px;border-radius:14px;background:var(--cream)}
.candle{position:absolute;bottom:180px;width:12px;height:44px;background:repeating-linear-gradient(var(--gold) 0 8px,var(--cream) 8px 16px);border-radius:3px}
.candle::before{content:'';position:absolute;top:-26px;left:-1px;width:14px;height:24px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:radial-gradient(#fff,#ffd36b 50%,#ff9a3c);box-shadow:0 0 22px 8px rgba(255,190,80,.7);animation:fk .3s infinite alternate}
.candle.out::before{opacity:0;animation:none}@keyframes fk{to{transform:scale(1.1,.92)}}
.bal{position:absolute;font-size:3rem;animation:flt 5s ease-in-out infinite alternate}@keyframes flt{to{transform:translateY(-22px) rotate(6deg)}}
/* letter */
.env{position:relative;width:min(300px,80vw);height:200px;margin:30px auto;background:var(--cream);border-radius:8px;box-shadow:0 10px 40px #0006;color:var(--plum);transition:transform 1.2s,opacity 1.2s}
.env::before{content:'';position:absolute;inset:0;background:linear-gradient(160deg,transparent 49%,#ecd9d2 50%) left/50% 100% no-repeat,linear-gradient(-160deg,transparent 49%,#ecd9d2 50%) right/50% 100% no-repeat}
.flap{position:absolute;top:0;left:0;right:0;height:110px;background:#e8cdc6;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform 1s}.env.open .flap{transform:rotateX(180deg)}.env.open{transform:translateY(60px);opacity:0}
.seal{position:absolute;left:50%;top:80px;transform:translateX(-50%);width:54px;height:54px;border-radius:50%;background:radial-gradient(#d33,#8c1c2c);color:#fcc;font-size:1.5rem;z-index:2;box-shadow:0 3px 10px #0008;transition:.5s}.env.open .seal{transform:translateX(-50%) scale(1.6);opacity:0}
.paper{background:var(--cream);color:var(--plum);border-radius:8px;padding:26px 22px;text-align:left;font-family:'Dancing Script',cursive;font-size:clamp(1.15rem,4.5vw,1.5rem);white-space:pre-wrap;box-shadow:0 14px 50px #0007;animation:pop .8s;line-height:1.7}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:14px}
.tile{padding:12px;border-radius:18px;background:rgba(255,245,233,.13);border:1px solid rgba(216,183,121,.5);backdrop-filter:blur(8px);transition:.3s}.tile:hover{transform:translateY(-4px) rotate(-1deg)}
.tile b{display:block;color:var(--gold);font-size:.85rem}.big{font-size:2.4rem}
.tiles.one{grid-template-columns:1fr}.tiles.one .tile{text-align:left;display:flex;gap:14px;align-items:center}
/* counters */
.num{font:700 2.4rem 'Cormorant Garamond',serif;color:var(--gold);line-height:1}.cell{padding:14px;border-radius:18px;background:rgba(255,245,233,.13);border:1px solid rgba(216,183,121,.5)}
.tk{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}.tk div{min-width:62px;padding:8px;border-radius:14px;background:rgba(52,36,58,.5);border:1px solid var(--gold)}.tk b{display:block;font:700 1.7rem 'Cormorant Garamond',serif;color:var(--pink)}.tk small{font-size:.7rem}
/* jar */
.jar{position:relative;width:200px;height:260px;margin:20px auto;border:3px solid rgba(255,255,255,.55);border-radius:30px 30px 50px 50px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 40px rgba(255,255,255,.2),0 0 50px rgba(216,183,121,.4);overflow:hidden;display:block}
.jar::before{content:'';position:absolute;top:-3px;left:20px;right:20px;height:22px;background:var(--gold);border-radius:6px}.jar i{position:absolute;width:16px;height:11px;background:var(--cream);border-radius:3px;box-shadow:0 0 12px 3px var(--gold);animation:tw 3s infinite}
.note{margin:10px auto;max-width:420px;animation:pop .7s;font-family:'Dancing Script',cursive;font-size:1.5rem;background:var(--cream);color:var(--plum);padding:16px;border-radius:10px;transform:rotate(-1.5deg)}
/* jar of reasons (big slips) */
.jar2{position:relative;width:min(350px,94vw);margin:26px auto 14px;padding:30px 10px 14px;border:3px solid rgba(255,255,255,.55);border-radius:34px 34px 56px 56px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 40px rgba(255,255,255,.2),0 0 50px rgba(216,183,121,.4)}
.jar2::before{content:'';position:absolute;top:-16px;left:14%;right:14%;height:26px;background:var(--gold);border-radius:8px}
.slips{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.slip{min-height:54px;border-radius:8px;background:var(--cream);color:var(--plum);font:700 1.3rem 'Cormorant Garamond',serif;box-shadow:0 0 12px rgba(216,183,121,.7);transform:rotate(var(--r));transition:.2s}
.slip:active{transform:scale(.9)}.slip.op{background:var(--pink);box-shadow:none;opacity:.75}
.rph{position:relative;height:min(52vh,340px);border:6px solid var(--cream);border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#f3b8c6,#c9b9e8);display:grid;place-items:center;font-size:4rem;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.rph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.rph.tall{height:min(60vh,420px)}
/* memory lane */
.mline{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:26px 14px;margin:26px 0 10px}
.pol{position:relative;display:flex;flex-direction:column;gap:3px;padding:8px 8px 10px;border-radius:6px;background:var(--cream);color:var(--plum);box-shadow:0 10px 26px rgba(0,0,0,.4);transform:rotate(var(--r));transition:.3s}
.pol::before{content:'♥';position:absolute;top:-15px;left:50%;transform:translateX(-50%);color:var(--rose);font-size:1.4rem}
.pol:hover{transform:rotate(0) scale(1.03)}
.pimg{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px dashed var(--rose);border-radius:3px;background:rgba(215,141,159,.18);font-size:2rem;overflow:hidden}
.pimg small{font-size:.7rem}.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pol b{font:700 1.25rem 'Dancing Script',cursive}.pol>small{font-size:.72rem;color:#7a5a6a}
/* flowers */
.fgrid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0}.fbtn{font-size:3rem;transition:.6s cubic-bezier(.2,1.6,.4,1);filter:saturate(.6) brightness(.9)}.fbtn.bl{transform:scale(1.4) rotate(20deg);filter:none}
/* heart constellation */
.sky{position:relative;max-width:460px;margin:12px auto;border-radius:24px;overflow:hidden;border:1px solid var(--gold);background:radial-gradient(ellipse at 50% 100%,#3a2352,#14102a 75%)}.sky svg{display:block;width:100%;height:auto}
.dst{animation:tws 3s infinite}@keyframes tws{50%{opacity:.25}}
#hf,#ho,#hi,#hph{opacity:0;transition:opacity 1.8s}#ho{filter:drop-shadow(0 0 6px #ffd36b)}#hph{cursor:pointer}
.ln{stroke:#ffd36b;stroke-width:1.8;stroke-linecap:round;filter:drop-shadow(0 0 3px #ffd36b);transition:stroke-dashoffset .7s}
.cs{cursor:pointer;outline:none}.cs polygon{fill:#bfb08a;transition:.3s}.cs.on polygon{fill:#fff3b8;filter:drop-shadow(0 0 5px #ffd36b)}.cs:focus-visible polygon{stroke:#fff;stroke-width:1.5}
.ring{fill:none;stroke:#ffd36b;stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center}.cs.nx .ring{animation:rp 1.2s infinite}.cs.nx polygon{fill:#fff}@keyframes rp{0%{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(1.7)}}
/* music */
#mu.on{animation:hb 1.4s infinite}.mctl{display:flex;gap:14px;justify-content:center;align-items:center;margin:8px 0}.mctl button{width:46px;height:46px;border-radius:50%;background:rgba(255,245,233,.15);border:1px solid var(--gold);font-size:1.2rem}.mctl #mpp{width:58px;height:58px;background:var(--gold);color:var(--plum);font-size:1.5rem}
.vol{display:flex;gap:8px;align-items:center;justify-content:center;margin:6px 0}.vol input{width:150px;margin:0;padding:0;letter-spacing:0;background:none;border:0}
#mtl{margin:10px 0;max-height:34vh;overflow:auto;text-align:left}.trk{display:flex;gap:6px;align-items:center;border-bottom:1px solid rgba(216,183,121,.3)}.trk button:first-child{flex:1;text-align:left;padding:9px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.trk.cur{color:var(--gold);font-weight:600}.trk button+button{padding:6px 10px;opacity:.7}
/* scratch */
.sc{position:relative;width:min(340px,86vw);aspect-ratio:4/3;margin:16px auto;border-radius:18px;overflow:hidden;border:2px solid var(--gold)}.sc>div{position:absolute;inset:0;display:grid;place-items:center;padding:14px;background:var(--cream);color:var(--plum);font-family:'Dancing Script',cursive;font-size:1.5rem}.sc canvas{position:absolute;inset:0;touch-action:none;transition:opacity 1s}
/* flips */
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.flip{perspective:900px;height:170px}.fi{position:relative;display:block;width:100%;height:100%;transition:transform .8s;transform-style:preserve-3d}.flip.f .fi{transform:rotateY(180deg)}
.ff,.fb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--gold)}
.ff{background:linear-gradient(135deg,rgba(243,184,198,.35),rgba(201,185,232,.35));font-size:2rem}.ff b{font:700 1.1rem 'Cormorant Garamond',serif}.fb{background:var(--cream);color:var(--plum);transform:rotateY(180deg);font-family:'Dancing Script',cursive;font-size:1.25rem;line-height:1.3}
.p .ff{background:radial-gradient(#4a3350,#2a1c30);box-shadow:0 0 25px rgba(216,183,121,.4)}.cp .ff{border-style:dashed;border-width:3px}
.tw{position:fixed;font-size:1.2rem;animation:tw 4s infinite}
.fin{font-size:clamp(1.3rem,5vw,2rem);opacity:0;transition:2s;margin:12px 0}.fin.vis{opacity:1}
.bigheart{font-size:5rem;animation:hb 1.2s infinite;filter:drop-shadow(0 0 30px #f3b8c6)}@keyframes hb{50%{transform:scale(1.18)}}
.nm{font-size:clamp(2.6rem,13vw,5rem);background:linear-gradient(90deg,var(--pink),var(--gold),var(--lav));-webkit-background-clip:text;background-clip:text;color:transparent}
/* memory */
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;margin:12px auto}.mc{perspective:600px;aspect-ratio:1}.mc.f .fi{transform:rotateY(180deg)}.mc .fb{font-size:2rem;font-family:inherit}.mc .ff{font-size:1.6rem}.mc.done .fb{background:var(--pink)}
.lrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}.lt{width:44px;height:48px;border-radius:12px;background:var(--cream);color:var(--plum);font:700 1.5rem 'Cormorant Garamond',serif}.lt:disabled{opacity:.3}
/* arena */
.arena{position:relative;height:50vh;min-height:300px;max-width:380px;margin:10px auto;border-radius:24px;border:1px solid var(--gold);overflow:hidden;touch-action:none;background:linear-gradient(#ffffff10,#d8b77933)}.basket{position:absolute;bottom:4%;left:50%;font-size:2.6rem;transform:translateX(-50%)}.it{position:absolute;font-size:1.8rem;transform:translateX(-50%)}
/* balloons */
.slots{display:flex;gap:6px;justify-content:center;margin:10px 0}.slots b{width:38px;height:46px;display:grid;place-items:center;border-radius:10px;border:1px dashed var(--gold);font:700 1.7rem 'Cormorant Garamond',serif;color:var(--pink)}
.bln{position:absolute;font-size:3.4rem;transition:transform .35s,opacity .35s;animation:flt 3s ease-in-out infinite alternate}.bln.pop{transform:scale(1.8);opacity:0;pointer-events:none}
/* wheel */
.whw{position:relative;width:260px;height:260px;margin:26px auto 8px}.ptr{position:absolute;left:50%;top:-22px;transform:translateX(-50%);font-size:2rem;color:var(--gold);z-index:3;font-style:normal}
.wheel{position:relative;width:100%;height:100%;border-radius:50%;border:6px solid var(--gold);background:conic-gradient(#F3B8C6 0 45deg,#C9B9E8 0 90deg,#FFF5E9 0 135deg,#D78D9F 0 180deg,#F3B8C6 0 225deg,#C9B9E8 0 270deg,#FFF5E9 0 315deg,#D78D9F 0 360deg);transition:transform 4.5s cubic-bezier(.1,.7,.1,1);box-shadow:0 0 40px rgba(216,183,121,.5)}
.wheel span{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px;font-size:1.9rem;text-align:center}
/* tic tac toe */
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(280px,80vw);margin:12px auto}.ttt button{aspect-ratio:1;border-radius:16px;background:rgba(255,245,233,.15);border:1px solid var(--gold);font-size:2.2rem}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head>
<body>
<div id="bg"></div><canvas id="fx"></canvas><div id="flash"></div><div id="toast" role="status"></div>
<div id="app"></div>
<div id="nav"><button id="pv" aria-label="Previous scene">‹</button><div id="pg"><span id="pt"></span><div id="bar"><i></i></div></div><button id="mu" aria-label="Music">🎵</button><button id="mn" aria-label="All scenes">✦</button><button id="nx" aria-label="Next scene">›</button></div>
<div id="modal"></div>
<script>
/* ============ ✏️ EDIT EVERYTHING HERE ============ */
const C={
 name:"Aayushi", from:"Varshil", password:"28112001",   // her birthday DDMMYYYY (28/11/2001) — a fun gate, NOT real security
 born:[2001,11,28],        // year, month, day
 met:[2025,3,16],          // first meeting: 16 March 2025
 wed:[2025,12,5],          // wedding: 5 December 2025
 letter:"My dearest Aayushi,\n\nI have started this letter so many times in my head, and every time I get stuck, because how do I fit you into a few lines?\n\nOn 16 March 2025, I met you. Something inside me went quiet and calm, like it had finally found the place to rest. I did not know it then, but that ordinary day was the beginning of the best thing in my life.\n\nThen we both said yes. Nobody was waiting, nobody was guessing. We just knew, at the very same time, and it still gives me goosebumps.\n\nAnd on 5 December 2025, you became my wife. Since that day, home is not a place for me anymore. Home is wherever you are.\n\nYou are my best friend, my peace, and the reason I am a better man. On your birthday, I just want you to know that you are so loved, today and on every ordinary day too.\n\nHappy Birthday, my love. Thank you for choosing me. I promise to keep choosing you, every single day.\n\nAlways yours,\nVarshil",
 letterAudio:"",   // 🎙️ optional: record yourself reading the letter and save it as letter.mp3 next to this file, then write "letter.mp3" here. If empty, the phone/computer reads it aloud in a built-in voice.

function readLetter(p,done){
 const L=C.letter,SS=window.speechSynthesis;let fin=false,tm=0,A=null,k=0;
 const sb=document.createElement('button');sb.className='btn';sb.textContent='🔇 Stop reading';p.parentNode.appendChild(sb);
 const show=n=>{p.textContent=RM?L:L.slice(0,n);const sc=p.closest('.scene');if(sc&&p.getBoundingClientRect().bottom>innerHeight-90)sc.scrollTop=sc.scrollHeight};
 const wd=setInterval(()=>{if(!(els[cur]&&els[cur].contains(p)))end()},500);
 function end(){if(fin)return;fin=true;clearInterval(tm);clearInterval(wd);try{SS&&SS.cancel()}catch(x){}A&&A.pause();p.textContent=L;sb.remove();musicOn();done()}
 sb.onclick=end;
 const type=n=>{clearInterval(tm);tm=setInterval(()=>{show(++n);if(n>=L.length)end()},35)};
 const tts=()=>{
  if(!SS||!window.SpeechSynthesisUtterance)return type(0);
  const vs=SS.getVoices(),V=vs.find(v=>/^en-IN/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));
  const ch=[],re=/[^.!?\n]*[.!?]+\s*|[^.!?\n]+|\n+/g;let m;while((m=re.exec(L)))ch.push({s:m.index,t:m[0]});
  const nx=()=>{if(fin)return;if(k>=ch.length)return end();const c=ch[k++],e0=c.s+c.t.length;
   if(!c.t.trim()){show(e0);return setTimeout(nx,450)}
   const u=new SpeechSynthesisUtterance(c.t);u.rate=.9;if(V){u.voice=V;u.lang=V.lang}
   u.onstart=()=>{let n=c.s;clearInterval(tm);tm=setInterval(()=>show(Math.min(++n,e0)),85)};   /* fallback pace if the browser sends no word events */
   u.onboundary=ev=>{clearInterval(tm);let j=c.s+ev.charIndex;while(j<e0&&!/\s/.test(L[j]))j++;show(j)};
   u.onend=()=>{clearInterval(tm);show(e0);/\n/.test(c.t)?setTimeout(nx,500):nx()};
   u.onerror=ev=>{clearInterval(tm);if(fin||ev.error==='canceled'||ev.error==='interrupted')return;type(c.s)};
   SS.speak(u)};
  nx()};
 if(C.letterAudio){A=new Audio(C.letterAudio);let ok=false;
  A.onplaying=()=>{ok=true;clearInterval(tm);tm=setInterval(()=>{if(A&&A.duration){let j=Math.floor(L.length*A.currentTime/A.duration);while(j<L.length&&!/\s/.test(L[j]))j++;show(j)}},100)};
  A.onended=end;A.onerror=()=>{if(!ok&&!fin){A=null;tts()}};A.play().catch(()=>{if(!ok&&!fin){A=null;tts()}})}
 else tts()}
